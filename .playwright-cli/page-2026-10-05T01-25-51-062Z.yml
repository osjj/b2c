            - generic [ref=f5e138]:
              - generic [ref=f5e139]:
                - paragraph [ref=f5e140]: Planning tools
                - paragraph [ref=f5e141]: Use these tools before moving from this guide into quantities, sizing, labels, or RFQ planning.
              - link "Planning PPE Quantity Calculator" [ref=f5e143] [cursor=pointer]:

                  - row [ref=f4e620]:
                    - cell "CE marking required" [ref=f4e621]
                    - cell "CE does not establish OSHA compliance" [ref=f4e622]
                    - cell "Check CE and conformity documents for the model and risk category" [ref=f4e623]
                  - row [ref=f4e624]:

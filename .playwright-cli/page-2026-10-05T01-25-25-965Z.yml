                    - cell "1926.96 names ANSI Z41.1-1967; confirm the applicable basis when specifying modern ASTM footwear" [ref=f4e602]
                    - cell "PPE Regulation conformity requirements; confirm the applicable EN edition and model documents" [ref=f4e603]
                  - row [ref=f4e604]:
                    - cell "Toe protection" [ref=f4e605]
                    - cell "Verify the offered ASTM edition, marking, and test evidence" [ref=f4e606]
                    - cell "EN safety-footwear baseline includes 200 J toe impact performance" [ref=f4e607]
                  - row [ref=f4e608]:

            - generic [ref=f4e165]:
              - paragraph [ref=f4e166]:
                - text: Construction safety footwear for a jobsite should normally start with a certified toe cap, puncture-resistant midsole, slip-resistant outsole, proper fit by worker size, and the right electrical, waterproof, heat, or metatarsal add-ons for the task. For US projects, specify
                - strong [ref=f4e167]: ASTM F2413
                - text: markings. For CE/EN or export projects, specify
                - strong [ref=f4e168]: EN ISO 20345
                - text: ratings such as S1P, S3, or S5.
              - paragraph [ref=f4e169]: A nail through the sole. A concrete block dropped from a scaffold. A slip on wet formwork. A live circuit contacted through a conductive boot.
              - paragraph [ref=f4e170]: Foot injuries on construction sites are among the most common, the most painful, and the most preventable workplace injuries in the industry. According to the National Safety Council, over 96,000 foot injuries required days away from work in the US in a recent two-year period — and the Bureau of Labor Statistics has consistently found that the majority of workers who suffered foot impact injuries were not wearing protective footwear at the time.
              - paragraph [ref=f4e171]: The typical construction foot injury involves an object falling less than four feet, weighing around 65 pounds. That is not a catastrophic incident. It is an ordinary moment on an ordinary site, made dangerous by the wrong footwear — or no footwear at all.
              - paragraph [ref=f4e172]: "This guide covers how to select the right safety boots or shoes for construction work: the hazards workers face, what the US and European standards require, how to read certification labels, and how to match construction site footwear to tasks, sizes, and procurement documents."
              - paragraph [ref=f4e173]:
                - text: Use this page together with the
                - link "complete construction PPE solution" [ref=f4e174] [cursor=pointer]:
                  - /url: /solutions/construction-site-ppe-solution
                - text: when footwear is part of a whole-site PPE program. For role-specific applications, connect it to
                - link "fall protection PPE for construction" [ref=f4e175] [cursor=pointer]:
                  - /url: /solutions/fall-protection-construction
                - text: ","
                - link "PPE for scaffolding and elevated platforms" [ref=f4e176] [cursor=pointer]:
                  - /url: /solutions/ppe-for-scaffolding-and-elevated-platforms
                - text: ","
                - link "PPE for road and bridge construction" [ref=f4e177] [cursor=pointer]:
                  - /url: /solutions/ppe-for-road-and-bridge-construction-projects
                - text: ", and"
                - link "PPE for electrical installation on construction sites" [ref=f4e178] [cursor=pointer]:
                  - /url: /solutions/ppe-for-electrical-installation-on-construction-sites
                - text: .
              - 'heading "Quick Answer: Construction Safety Footwear For Site Buyers" [level=2] [ref=f4e184]'
              - paragraph [ref=f4e185]: For a construction footwear RFQ, ask for a certified boot or shoe by site hazard, surface condition, electrical exposure, and workforce size curve, not just a "steel toe boot." A common starting specification for active construction covers toe impact/compression, puncture and slip hazards, and proper fit, but the final features and ratings must come from the actual task and site conditions.
              - table [ref=f4e187]:
                - rowgroup [ref=f4e188]:
                  - row [ref=f4e189]:
                    - columnheader "Buyer decision" [ref=f4e190]
                    - columnheader "What to specify" [ref=f4e191]
                    - columnheader "Why it matters" [ref=f4e192]
                - rowgroup [ref=f4e193]:
                  - row [ref=f4e194]:
                    - cell "General construction site footwear" [ref=f4e195]
                    - cell "Toe protection, puncture resistance, slip resistance, durable upper, and fit range" [ref=f4e196]
                    - 'cell "Covers the most common foot hazards: falling objects, nails, wet surfaces, rubble, and long walking shifts." [ref=f4e197]'
                  - row [ref=f4e198]:
                    - cell "US compliance" [ref=f4e199]
                    - cell "ASTM F2413 version, toe impact/compression, puncture resistance, EH or SD where needed" [ref=f4e200]
                    - cell "Keeps the quote tied to a testable footwear label instead of a generic description." [ref=f4e201]
                  - row [ref=f4e202]:
                    - cell "Export or international projects" [ref=f4e203]
                    - cell "EN ISO 20345 rating such as S1, S1P, S3, S5, plus slip and penetration details" [ref=f4e204]
                    - cell "Helps buyers compare CE/EN footwear without mixing incompatible ratings." [ref=f4e205]
                  - row [ref=f4e206]:

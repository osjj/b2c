                    - cell "Men's and women's size curve, width needs, socks, climate, and return/replenishment plan" [ref=f4e212]
                    - cell "OSHA's 2025 proper-fit rule makes narrow size planning a compliance risk." [ref=f4e213]
                  - row [ref=f4e214]:
                    - cell "Bulk ordering" [ref=f4e215]
                    - cell "Baseline quantity, spare sizes, replacement stock, wet-weather or electrical add-ons" [ref=f4e216]

                    - cell "Distinguish basic slip performance from optional SR" [ref=f4e627]
              - heading "Frequently Asked Questions" [level=2] [ref=f4e633]
              - paragraph [ref=f4e634]:
                - strong [ref=f4e635]: What is the minimum safety footwear for a general construction labourer?
                - text: There is no single specification suitable for every construction task. Start with the assessed impact, compression, penetration, slip, and fit requirements. For US purchasing, verify the ASTM edition and required markings alongside the applicable OSHA construction requirements. For EN purchasing, an S3-family category may be a starting point for outdoor work; specify the insert type and any additional SR, FO, electrical, or other task-specific evidence separately.
              - paragraph [ref=f4e636]:
                - strong [ref=f4e637]: What safety footwear is needed on a construction site?
                - text: Most construction sites need safety footwear with toe impact/compression protection, puncture resistance, slip resistance, durable uppers, and a size range that actually fits the workforce. Add EH protection for electrical exposure, metatarsal protection for heavy material handling, waterproofing for wet sites, and heat or cold features where the surface or climate requires it.
              - paragraph [ref=f4e638]:
                - strong [ref=f4e639]: What should a buyer specify for construction site footwear in bulk?
                - text: "Specify the standard, rating, and size curve, not just the product name. A strong RFQ line says something like: ASTM F2413 I/75 C/75 PR EH safety footwear, or EN ISO 20345 S3 SR safety footwear, with men's and women's size ranges, width needs, spare sizes, replacement stock, label photos, and delivery country."
              - paragraph [ref=f4e640]:
                - strong [ref=f4e641]: Do I need steel toe boots, or will composite toe work?
                - text: Both steel and composite toe caps can achieve the same ASTM I/75 or EN 200J impact rating. Either can be acceptable when the complete footwear carries the markings required by the hazard assessment. Composite toe is not automatically required for ASTM EH footwear, and toe material alone does not establish electrical protection. Composite may reduce weight or cold transfer, while steel can offer a compact, durable, cost-effective construction.
              - paragraph [ref=f4e642]:
                - strong [ref=f4e643]: Does EH-rated footwear protect against all electrical hazards?
                - text: No. EH rating provides secondary protection against inadvertent contact with live circuits under dry conditions only. It does not protect against direct, sustained contact with high-voltage sources and provides no protection once wet. Workers performing live electrical work should use purpose-rated electrical insulating boots.
              - paragraph [ref=f4e644]:
                - strong [ref=f4e645]: How often should construction safety boots be replaced?
                - text: Most manufacturers recommend replacement every 6 to 12 months under heavy construction use. Replace immediately if the boot has sustained a significant impact event, if the outsole is worn smooth, or if the upper shows cracks or splits.
              - paragraph [ref=f4e646]:
                - strong [ref=f4e647]: Does OSHA require appropriately fitting construction footwear for women?
                - text: Yes. The January 2025 revision to 29 CFR 1926.95(c) requires PPE, including footwear, to properly fit each affected worker. OSHA does not prescribe one product label called a "women's construction boot," but employers must provide the sizes, widths, lasts, or designs needed for real fit instead of assuming a smaller men's size will work for everyone.
              - paragraph [ref=f4e648]:
                - strong [ref=f4e649]: What does EN ISO 20345 S3 mean?
                - text: Under the 2022 edition, S3 combines the basic safety-footwear requirements with antistatic properties, heel energy absorption, a water-resistant upper, penetration resistance, and a cleated outsole. S3, S3L, and S3S distinguish the insert test category. Additional SR slip testing and FO fuel-oil resistance are separate claims; whole-footwear water resistance is also distinct from upper water resistance.
              - paragraph [ref=f4e650]:
                - strong [ref=f4e651]: What is the LG marking on safety boots?
                - text: LG (Ladder Grip) is a marking introduced in EN ISO 20345:2022. It certifies that the outsole provides secure grip on ladder rungs - directly relevant for scaffolders, roofers, and any worker who regularly climbs ladders. It has no equivalent in the current ASTM F2413 standard.
              - heading "Build Your Construction Footwear Programme" [level=2] [ref=f4e657]
              - paragraph [ref=f4e658]: Selecting the right safety footwear for a construction workforce requires matching certified performance levels to the actual hazards each worker faces. A one-size-fits-all boot specification will inevitably leave some workers under-protected and others in heavier, more expensive footwear than their role requires.
              - paragraph [ref=f4e659]: Send your destination market, task hazards, required standard and edition, size curve, quantity, and delivery schedule with your footwear inquiry. Before approving a model, confirm its specific markings, supporting test reports or conformity documents, available sizes, and sample fit. Certification and protective properties must be verified for the exact offered model; this guide does not establish them for every product in the range.

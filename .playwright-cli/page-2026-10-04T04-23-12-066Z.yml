              - generic [ref=f3e416]:
                - heading "First 40 hours" [level=3] [ref=f3e420]
                - paragraph [ref=f3e421]: Expect light pressure at the heel and instep — this resolves as the leather conforms. Sharp pain or toe-cap contact means wrong size.
              - generic [ref=f3e422]:
                - heading "Toe test" [level=3] [ref=f3e429]
                - paragraph [ref=f3e430]: Kick a flat wall lightly. Your longest toe should never feel the toe cap — if it does, the boot is too short regardless of labelled size.

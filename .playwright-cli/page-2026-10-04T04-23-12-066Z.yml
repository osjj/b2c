            - heading "How to measure your feet" [level=2] [ref=f3e175]
            - paragraph [ref=f3e176]: Foot length in millimetres is the most accurate measurement for safety footwear. Take 5 minutes to do it properly and you will avoid the 40% of online boot returns caused by size mismatch.
            - list [ref=f3e177]:
              - listitem [ref=f3e178]:
                - generic [ref=f3e179]: "1"
                - generic [ref=f3e180]:
                  - heading "Measure at the end of the day" [level=3] [ref=f3e181]
                  - paragraph [ref=f3e182]: Feet swell throughout a shift — measuring in the evening or after several hours on your feet captures the maximum size and prevents cramped boots.
              - listitem [ref=f3e183]:
                - generic [ref=f3e184]: "2"
                - generic [ref=f3e185]:
                  - heading "Wear your work socks" [level=3] [ref=f3e186]
                  - paragraph [ref=f3e187]: Thick thermal or cushioned safety socks add 2–3 mm of length. Always measure with the socks you plan to wear with the boots.
              - listitem [ref=f3e188]:
                - generic [ref=f3e189]: "3"
                - generic [ref=f3e190]:
                  - heading "Stand on a sheet of paper" [level=3] [ref=f3e191]
                  - paragraph [ref=f3e192]: Place a sheet against a wall. Stand with your heel touching the wall and your weight evenly distributed — sitting under-measures by 3–5 mm.
              - listitem [ref=f3e193]:
                - generic [ref=f3e194]: "4"
                - generic [ref=f3e195]:
                  - heading "Mark the longest toe" [level=3] [ref=f3e196]
                  - paragraph [ref=f3e197]: With a pencil held vertically, mark the paper at the tip of your longest toe. Do both feet — one foot is usually 2–4 mm longer.
              - listitem [ref=f3e198]:
                - generic [ref=f3e199]: "5"
                - generic [ref=f3e200]:
                  - heading "Measure to the wall" [level=3] [ref=f3e201]
                  - paragraph [ref=f3e202]: Measure the distance from the wall edge to your mark in millimetres. Always buy for the longer foot.
              - listitem [ref=f3e203]:
                - generic [ref=f3e204]: "6"
                - generic [ref=f3e205]:
                  - heading "Add 10 mm of toe room" [level=3] [ref=f3e206]
                  - paragraph [ref=f3e207]: Safety boots with steel or composite toe caps need 10 mm (about 1 cm) of room in front of your longest toe so the toe cap never presses on your nails when you walk downhill.

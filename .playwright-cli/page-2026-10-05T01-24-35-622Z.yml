                - generic [ref=f2e1061]:
                  - generic [ref=f2e1062]:
                    - heading "Who is responsible for PPE on a construction site?" [level=3] [ref=f2e1063]
                    - paragraph [ref=f2e1064]: Under OSHA construction rules, the employer is generally responsible for hazard assessment, supplying required PPE, and ensuring workers are trained and properly equipped for the task.
                  - generic [ref=f2e1065]:
                    - heading "Does construction PPE have to fit each worker?" [level=3] [ref=f2e1066]
                    - paragraph [ref=f2e1067]: Yes. Since January 13, 2025, OSHA construction rules explicitly require PPE to be selected so it properly fits each affected employee.
                  - generic [ref=f2e1068]:
                    - heading "What is the biggest PPE failure on construction sites?" [level=3] [ref=f2e1069]
                    - paragraph [ref=f2e1070]: A common failure is treating PPE as a box-ticking purchase instead of a hazard-matched system. Sites often under-specify fit, respiratory protection, or replacement cycles even when head and footwear basics are in place.
                  - generic [ref=f2e1071]:
                    - heading "When should a contractor step up from disposable dust masks to reusable respirators?" [level=3] [ref=f2e1072]
                    - paragraph [ref=f2e1073]: Once tasks involve sustained silica dust, demolition contaminants, welding fumes, or mixed dust and vapor exposure, reusable respirators with the correct filters usually become the safer and more controllable option.
                  - generic [ref=f2e1074]:
                    - heading "What should procurement teams ask for before approving a PPE supplier?" [level=3] [ref=f2e1075]
                    - paragraph [ref=f2e1076]: Ask for certification documents, test reports where relevant, size availability, replacement guidance, and proof that the supplier can support repeat bulk supply instead of one-off shipments.
              - generic [ref=f2e1077]: This pillar page is built around the OSHA construction PPE framework, EN and CE product standards, and current construction fatality and hazard patterns used by site safety teams when they build practical PPE programs.

              - generic [ref=f2e375]:
                - heading "OSHA construction PPE requirements and the 2025 fit rule" [level=2] [ref=f2e376]
                - generic [ref=f2e377]:
                  - paragraph [ref=f2e378]: Construction PPE obligations sit mainly under 29 CFR 1926 Subpart E, with 29 CFR 1926.95 requiring employers to assess hazards, provide the right PPE, keep it in reliable condition, and train workers on fit, use, limits, and care.
                  - paragraph [ref=f2e379]: "The January 13, 2025 update to 29 CFR 1926.95(c) makes proper fit explicit. That matters operationally: oversized harnesses do not arrest falls correctly, loose goggles leak dust and debris, gloves that are too long can snag in equipment, and one-size bulk buying is no longer a defensible default."
                  - paragraph [ref=f2e380]: For multi-site contractors, the fit rule changes procurement behavior. Size ranges, wearer records, and replacement planning need to be part of the PPE program, not an afterthought after site delivery.

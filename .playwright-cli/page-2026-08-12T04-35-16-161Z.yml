            - generic [ref=e155]:
              - paragraph [ref=e156]: A mining PPE checklist should change with the task. A driller working beside a rig, an authorized blasting team, a crusher operator, a screen-deck inspector, a haul-road spotter, and a maintenance technician can work at the same mine while facing very different dust, noise, impact, visibility, entanglement, chemical, electrical, and stored-energy hazards.
              - paragraph [ref=e157]: This field guide helps mine and quarry supervisors turn the day's work plan into a task-specific PPE check. It covers drilling, blasting, crushing, screening and processing, haul roads and transport, and maintenance. It does not replace the mine's risk assessment, exposure monitoring, traffic plan, blast plan, isolation procedure, training, equipment manuals, or local legal requirements.
              - paragraph [ref=e158]:
                - text: For the broader category, documentation, sizing, and bulk RFQ framework, use the
                - link "Mining Safety Equipment and PPE for Quarry Operations solution" [ref=e159] [cursor=pointer]:
                  - /url: /solutions/ppe-safety-equipment-for-mining-quarrying
                - text: . This article stays focused on the pre-task and start-of-shift checklist.
              - heading "Quick Mining PPE Checklist by Task" [level=2] [ref=e165]
              - paragraph [ref=e166]: Use this matrix to identify what must be confirmed before the detailed task check begins. The PPE column is a selection prompt, not a universal minimum kit.
              - figure "A task matrix separates drilling, blasting, crushing, screening, haul-road, and maintenance checks before PPE is issued." [ref=e167]:
                - img "A task matrix separates drilling, blasting, crushing, screening, haul-road, and maintenance checks before PPE is issued." [ref=e169]
              - table [ref=e172]:
                - rowgroup [ref=e173]:
                  - row [ref=e174]:
                    - columnheader "Task" [ref=e175]
                    - columnheader "Verify controls and conditions first" [ref=e176]
                    - columnheader "PPE questions to close before work" [ref=e177]
                - rowgroup [ref=e178]:
                  - row [ref=e179]:
                    - cell "Drilling" [ref=e180]
                    - cell "Ground condition, drill guarding, exclusion zone, dust suppression or collection, noise exposure, lighting, communication" [ref=e181]
                    - cell "Head and eye protection; hearing protection; respirator only from the exposure assessment and program; gloves that do not create an entanglement hazard; boots for terrain and puncture risk" [ref=e182]
                  - row [ref=e183]:
                    - cell "Blasting" [ref=e184]
                    - cell "Authorized personnel, site-specific blast plan, blast area, access guards, warning and communication method, evacuation, post-blast inspection and re-entry release" [ref=e185]
                    - cell "Site-defined head, eye, hearing, visibility, footwear, clothing, and respiratory requirements for the worker's authorized role and re-entry conditions" [ref=e186]
                  - row [ref=e187]:
                    - cell "Crushing" [ref=e188]
                    - cell "Guards, blocked material procedure, dust controls, isolation points, safe access, start-up warning, housekeeping" [ref=e189]
                    - cell "Impact-rated eye protection; hearing protection; task-selected respiratory protection; head protection; gloves and boots suited to material handling and access conditions" [ref=e190]
                  - row [ref=e191]:
                    - cell "Screening and processing" [ref=e192]
                    - cell "Guards, walkways, spillage, dust and mist controls, chemical information, safe sampling points, working-at-height controls" [ref=e193]
                    - cell "Eye or face protection; hearing protection; respiratory protection where assessed; gloves matched to product or chemical contact; footwear; fall protection only within a designed system" [ref=e194]
                  - row [ref=e195]:
                    - cell "Haul roads and transport" [ref=e196]
                    - cell "Traffic plan, blind areas, communication, road and berm condition, lighting, weather, pre-operational inspection, safe parking and pedestrian zones" [ref=e197]
                    - cell "High-visibility clothing for ground exposure; head, eye, hearing, respiratory, hand, and foot protection based on outside-cab tasks; seat belt and cab controls checked separately" [ref=e198]
                  - row [ref=e199]:
                    - cell "Maintenance" [ref=e200]
                    - cell "Shutdown scope, all energy sources, isolation and verification, blocking, permits, access, hot work, electrical or confined-space controls" [ref=e201]
                    - cell "Eye and face protection; task-specific gloves; hearing and respiratory protection; head and foot protection; welding, electrical, fall, or chemical PPE only after the specialist hazard review" [ref=e202]
              - paragraph [ref=e203]: If the first column cannot be verified, adding more PPE does not make the task ready. Stop and resolve the control, authorization, or work-condition gap first.
              - 'heading "Before Any Task: Six Checks That Apply Across the Mine" [level=2] [ref=e204]'
              - paragraph [ref=e205]: "Run these six checks before selecting the task module:"
              - list [ref=e206]:
                - listitem [ref=e207]:
                  - generic [ref=e208]:
                    - strong [ref=e209]: Name the exact task and location.
                    - text: "\"Processing\" is too broad. Record whether the worker is operating from a closed cab, taking a sample, clearing spillage, inspecting a screen, changing a liner, or entering a restricted area."
                - listitem [ref=e210]:
                  - generic [ref=e211]:
                    - strong [ref=e212]: Confirm the control status.
                    - text: Verify guarding, ventilation, wet suppression, local extraction, isolation, barriers, traffic separation, lighting, and communication before relying on PPE.
                - listitem [ref=e213]:
                  - generic [ref=e214]:
                    - strong [ref=e215]: Review measured exposure.
                    - text: Noise and airborne contaminant decisions should come from exposure data and the mine's program. Do not select a respirator or hearing protector from the task name alone.
                - listitem [ref=e216]:
                  - generic [ref=e217]:
                    - strong [ref=e218]: Check compatibility and fit.
                    - text: Head protection, eyewear, earmuffs, respirators, lamps, face shields, garments, and fall-protection equipment must work together without breaking seals, loosening retention, or hiding reflective material.
                - listitem [ref=e219]:
                  - generic [ref=e220]:
                    - strong [ref=e221]: Inspect before issue.
                    - text: Remove damaged, contaminated, expired, incomplete, badly fitting, or unauthorized equipment from service. Include replaceable parts and consumables in the check.
                - listitem [ref=e222]:
                  - generic [ref=e223]:
                    - strong [ref=e224]: Define the change trigger.
                    - text: "Tell the crew when the checklist must be repeated: a new bench, different rock, dry instead of wet operation, a failed dust control, changed traffic route, night work, maintenance entry, spill, misfire, or unexpected ground condition."
              - paragraph [ref=e225]:
                - text: For U.S. surface and underground metal and nonmetal mines, the current
                - link "30 CFR Parts 56 and 57" [ref=e226] [cursor=pointer]:
                  - /url: https://www.ecfr.gov/current/title-30/chapter-I/subchapter-K
                - text: organize requirements by hazards such as explosives, drilling, haulage, machinery, electricity, and personal protection. Other jurisdictions use different rules, so treat the U.S. references in this guide as examples rather than a global compliance list.
              - heading "Drilling PPE Checklist" [level=2] [ref=e227]
              - paragraph [ref=e228]: Drilling can combine respirable dust, flying fragments, high noise, vibration, rotating components, rough ground, overhead exposure, compressed air, and vehicle interaction. Keep the checklist tied to the drill type, position, rock, dust-control method, and whether the worker is inside or outside an enclosed cab.
              - figure "Drilling PPE decisions follow ground conditions, guarding, dust controls, measured noise, work position, and equipment instructions." [ref=e229]:
                - img "Drilling PPE decisions follow ground conditions, guarding, dust controls, measured noise, work position, and equipment instructions." [ref=e231]
              - heading "Controls and work conditions" [level=3] [ref=e233]
              - list [ref=e234]:
                - listitem [ref=e235]: Has the driller completed the task and area examination required by the mine procedure?
                - listitem [ref=e236]: Is the drill on stable ground with the work zone, moving components, rods, and access route controlled?
                - listitem [ref=e237]: Are guards, interlocks, dust collection, water delivery, ventilation, and cab filtration operating as intended?
                - listitem [ref=e238]: Are nearby workers outside the drill's restricted or exclusion area?
                - listitem [ref=e239]: Is communication clear between the operator, helper, mobile-equipment operators, and supervisor?
                - listitem [ref=e240]: Has noise and respirable dust exposure been assessed for this drill, material, control method, and work position?
                - listitem [ref=e241]: Is lighting sufficient for rod handling, access, inspection, and ground-condition checks?
              - heading "PPE and issue check" [level=3] [ref=e242]
              - list [ref=e243]:
                - listitem [ref=e244]:
                  - generic [ref=e245]:
                    - strong [ref=e246]: "Head:"
                    - text: Select
                    - link "safety helmets" [ref=e247] [cursor=pointer]:
                      - /url: /categories/head-protection/safety-helmets
                    - text: for the mine's impact, retention, clearance, accessory, and lamp requirements; inspect shell, suspension, retention, and attachments.
                - listitem [ref=e248]:
                  - generic [ref=e249]:
                    - strong [ref=e250]: "Eyes and face:"
                    - text: Select safety glasses, sealed
                    - link "safety goggles" [ref=e251] [cursor=pointer]:
                      - /url: /categories/eye-protection/safety-goggles
                    - text: ", or face protection from the fragment direction, dust level, compressed-air use, and nearby work. A face shield is normally supplementary rather than a replacement for primary eye protection."
                - listitem [ref=e252]:
                  - generic [ref=e253]:
                    - strong [ref=e254]: "Hearing:"
                    - text: Select
                    - link "hearing protection" [ref=e255] [cursor=pointer]:
                      - /url: /categories/head-protection/hearing-protection
                    - text: from measured noise, required attenuation, communication needs, and compatibility with the helmet and eyewear.
                - listitem [ref=e256]:
                  - generic [ref=e257]:
                    - strong [ref=e258]: "Respiratory:"
                    - text: Use engineering controls first. If respiratory protection is required, select an approved device through the mine's written program, exposure data, medical evaluation, fit testing, training, and change-out or maintenance rules. Do not default every quarry driller to the same disposable mask.
                - listitem [ref=e259]:
                  - generic [ref=e260]:
                    - strong [ref=e261]: "Hands:"
                    - text: Match gloves to handling, abrasion, cut, impact, grip, temperature, and vibration needs. Confirm the equipment manufacturer and site procedure permit glove use at that point; loose clothing and gloves can increase entanglement risk near rotating components.
                - listitem [ref=e262]:
                  - generic [ref=e263]:
                    - strong [ref=e264]: "Feet and body:"
                    - text: Check protective toe, puncture, metatarsal, slip, ankle, terrain, weather, and visibility needs. Keep loose garments, drawstrings, and unsecured accessories away from moving parts.
              - paragraph [ref=e265]:
                - text: NIOSH notes that rock drilling and quarry work can create respirable crystalline silica exposure and that personal monitoring helps characterize a miner's exposure. Use the current
                - link "NIOSH mining and silicosis resources" [ref=e266] [cursor=pointer]:
                  - /url: https://www.cdc.gov/niosh/mining/topics/silicosis.html
                - text: as exposure-control context, not as a shortcut to a respirator model.
              - heading "Blasting PPE Checklist" [level=2] [ref=e267]
              - paragraph [ref=e268]: Blasting is not a PPE-led task. Authorization, blast-area control, communication, evacuation, guarding, and a competent post-blast inspection determine whether people can be present. This checklist deliberately avoids explosive selection, loading, initiation, timing, or misfire-handling instructions.
              - figure "Blast-area authorization, access control, warnings, evacuation, and post-blast inspection come before role-specific PPE." [ref=e269]:
                - img "Blast-area authorization, access control, warnings, evacuation, and post-blast inspection come before role-specific PPE." [ref=e271]
              - heading "Authorization and area control" [level=3] [ref=e273]
              - list [ref=e274]:
                - listitem [ref=e275]: Is every person involved trained, authorized, and assigned a defined role under the mine's blast procedure?
                - listitem [ref=e276]: Has the authorized team reviewed the site-specific blast plan and the conditions that affect the blast area?
                - listitem [ref=e277]: Are access routes guarded or barricaded, with people and vehicles removed before firing?
                - listitem [ref=e278]: Are warnings, radios, sirens, hand signals, and the all-clear method understood and tested?
                - listitem [ref=e279]: Is the blast shelter or evacuation location suitable for the site conditions?
                - listitem [ref=e280]: Are weather, visibility, public-road, neighboring-work-area, and mobile-equipment interactions addressed?
                - listitem [ref=e281]: After firing, has the authorized person completed the required post-blast inspection and released the area for re-entry?
                - listitem [ref=e282]: If there is a suspected misfire, unusual fume, flyrock, ground instability, or communication failure, has re-entry stopped under the site procedure?
              - heading "PPE and readiness check" [level=3] [ref=e283]
              - list [ref=e284]:
                - listitem [ref=e285]: Issue only the PPE specified for the worker's authorized role and location; do not treat PPE as permission to remain in a blast area.
                - listitem [ref=e286]: Confirm head, eye, hearing, visibility, footwear, hand, weather, and clothing requirements for preparation and permitted post-blast tasks.
                - listitem [ref=e287]: Base respiratory protection for post-blast dust or contaminants on monitoring, ventilation, re-entry criteria, and the written respiratory program—not on a fixed waiting time or a generic filter.
                - listitem [ref=e288]: Inspect radios, cap lamps, high-visibility outer layers, eyewear, and other role-critical equipment before the blast sequence begins.
                - listitem [ref=e289]: Keep logos, badges, tools, and garment layers from covering reflective areas or interfering with PPE fit.
              - paragraph [ref=e290]:
                - text: MSHA's
                - link "explosives and blasting safety alert" [ref=e291] [cursor=pointer]:
                  - /url: https://www.msha.gov/sites/default/files/News_Media/Explosives-Alert.pdf
                - text: emphasizes blast-area clearance, guarded access, warnings, and a post-blast inspection before re-entry. Apply the mine's current rules and the blasting authority's direction; this article is only a readiness prompt.
              - heading "Crushing PPE Checklist" [level=2] [ref=e292]
              - paragraph [ref=e293]: Crusher work changes by position. A control-room operator, feeder attendant, loader operator, cleanup worker, sampler, and mechanic do not share the same exposure. Define whether the worker is operating, observing, sampling, cleaning, clearing a blockage, or maintaining equipment.
              - figure "Crusher checks combine guarding, dust and noise controls, safe access, startup warnings, and task-specific PPE." [ref=e294]:
                - img "Crusher checks combine guarding, dust and noise controls, safe access, startup warnings, and task-specific PPE." [ref=e296]
              - heading "Controls and access" [level=3] [ref=e298]
              - list [ref=e299]:
                - listitem [ref=e300]: Are crusher, feeder, conveyor, and transfer-point guards complete and secured?
                - listitem [ref=e301]: Are water sprays, extraction, enclosures, and housekeeping controls operating?
                - listitem [ref=e302]: Are walkways, stairs, handrails, platforms, and emergency stops accessible and free of spillage?
                - listitem [ref=e303]: Is a safe procedure in place for bridged or blocked material, and is entry or manual intervention prohibited until the required isolation and blocking are complete?
                - listitem [ref=e304]: Are start-up warnings and communication methods working?
                - listitem [ref=e305]: Are workers separated from loader routes, falling material, discharge zones, and suspended loads?
              - heading "PPE and issue check" [level=3] [ref=e306]
              - list [ref=e307]:
                - listitem [ref=e308]: Select impact-rated eye protection from the fragment and dust exposure; add face protection where the task assessment requires it.
                - listitem [ref=e309]: Select hearing protection from measured crusher and conveyor noise and confirm workers can still receive critical warnings.
                - listitem [ref=e310]: Select respiratory protection from the contaminant, exposure result, dust controls, assigned protection requirement, and written program.
                - listitem [ref=e311]: Select head protection for falling material, fixed structures, access clearance, and retention needs.
                - listitem [ref=e312]: Choose gloves for sample handling, sharp rock, abrasion, cut, impact, grip, heat, or chemicals—but do not allow gloves or loose clothing near unguarded moving components.
                - listitem [ref=e313]: Choose boots for toe and metatarsal exposure, puncture, slip, spillage, stairs, and wet or uneven ground.
              - paragraph [ref=e314]: If a worker is clearing a jam, changing a liner, entering a chute, or working behind a guard, stop using the operating checklist and switch to the maintenance and isolation checklist below.
              - heading "Screening and Processing PPE Checklist" [level=2] [ref=e315]
              - paragraph [ref=e316]: Screens and processing plants add vibrating equipment, conveyors, dust, wet product, reagents, sampling points, elevated walkways, and repeated inspection routes. The checklist must separate normal operation from cleaning, sampling, reagent handling, and maintenance.
              - figure "Processing PPE changes between normal operation, sampling, cleanup, reagent handling, and maintenance access." [ref=e317]:
                - img "Processing PPE changes between normal operation, sampling, cleanup, reagent handling, and maintenance access." [ref=e319]
              - heading "Controls and work conditions" [level=3] [ref=e321]
              - list [ref=e322]:
                - listitem [ref=e323]: Are screen drives, belts, pulleys, shafts, return rollers, and other moving parts guarded?
                - listitem [ref=e324]: Are walkway spillage, mud, standing water, loose material, and trip hazards controlled?
                - listitem [ref=e325]: Are dust extraction, spray systems, ventilation, and enclosed cabins functioning?
                - listitem [ref=e326]: Are sampling points designed so the worker can take a sample without reaching into moving equipment or entering a discharge path?
                - listitem [ref=e327]: Are chemical labels, safety data, eyewash or shower access, and spill controls available where reagents or treatment chemicals are used?
                - listitem [ref=e328]: Are platform, ladder, edge, and opening controls complete before elevated inspection begins?
              - heading "PPE and issue check" [level=3] [ref=e329]
              - list [ref=e330]:
                - listitem [ref=e331]: Use safety glasses, goggles, or a face shield combination selected for dust, flying particles, splash, mist, and the chemical involved.
                - listitem [ref=e332]: Select hearing protection from measurements around screens, drives, pumps, crushers, and conveyors.
                - listitem [ref=e333]: Select respiratory protection only after identifying the contaminant and exposure; verify the face seal is not compromised by eyewear or other PPE.
                - listitem [ref=e334]: "Choose gloves from the actual contact: sharp samples, wet grip, abrasion, chemical splash, heat, or cleaning. One general-purpose glove is rarely suitable for every processing task."
                - listitem [ref=e335]: Check boots for slip, toe, puncture, chemical, wet-work, and stair-grip needs.
                - listitem [ref=e336]: Where fall protection is required, use only the site-designed system with approved anchorage, compatible connectors, clearance, inspection, and rescue planning. A harness alone is not a fall-protection system.
              - paragraph [ref=e337]:
                - text: For workers exposed to respirable crystalline silica, U.S. mine operators should review the current
                - link "30 CFR Part 60 respiratory protection requirements" [ref=e338] [cursor=pointer]:
                  - /url: https://www.ecfr.gov/current/title-30/chapter-I/subchapter-K/part-60/subpart-B/section-60.14
                - text: ", including program administration, medical evaluation, selection, training, fit testing, maintenance, inspection, and storage."
              - heading "Haul Roads and Transport PPE Checklist" [level=2] [ref=e339]
              - paragraph [ref=e340]: High-visibility clothing is useful around mobile equipment, but visibility apparel cannot replace traffic separation, blind-area controls, communication, road maintenance, berms, safe speeds, and seat-belt use. Separate the in-cab operator check from the outside-cab and pedestrian check.
              - figure "Haul-road readiness connects traffic separation, visibility, communication, road condition, vehicle inspection, and outside-cab PPE." [ref=e341]:
                - img "Haul-road readiness connects traffic separation, visibility, communication, road condition, vehicle inspection, and outside-cab PPE." [ref=e343]
              - heading "Route, vehicle, and communication check" [level=3] [ref=e345]
              - list [ref=e346]:
                - listitem [ref=e347]: Is the current traffic plan understood by operators, contractors, spotters, pedestrians, and visitors?
                - listitem [ref=e348]: Are one-way routes, right-of-way rules, parking areas, dump points, exclusion zones, and pedestrian crossings clear?
                - listitem [ref=e349]: Have road width, grade, berms, potholes, rutting, loose material, dust, water, lighting, and weather been checked?
                - listitem [ref=e350]: Has the operator completed the pre-operational equipment inspection and reported safety defects?
                - listitem [ref=e351]: Are camera, proximity, lighting, horn, alarm, radio, and other warning systems functioning?
                - listitem [ref=e352]: Does every approach to large equipment require positive communication or another site-approved confirmation?
                - listitem [ref=e353]: Is the seat belt and mounting hardware inspected and used as required?
              - heading "Outside-cab and pedestrian PPE check" [level=3] [ref=e354]
              - list [ref=e355]:
                - listitem [ref=e356]:
                  - generic [ref=e357]:
                    - text: Wear
                    - link "hi-vis workwear" [ref=e358] [cursor=pointer]:
                      - /url: /categories/body-protection/hi-vis-workwear
                    - text: that remains visible from the directions and under the lighting expected on the route. Keep it as the visible outer layer and replace heavily soiled, faded, torn, or covered garments.
                - listitem [ref=e359]: Use head protection required for the work zone, especially when inspecting near loading, dumping, overhead structures, or loose material.
                - listitem [ref=e360]: Select eyewear for wind, dust, glare, flying particles, and maintenance inspection; clean it before leaving the cab.
                - listitem [ref=e361]: Carry or issue hearing and respiratory protection for outside-cab tasks only where the exposure assessment and site rules require it.
                - listitem [ref=e362]:
                  - generic [ref=e363]:
                    - text: Select gloves and
                    - link "safety boots" [ref=e364] [cursor=pointer]:
                      - /url: /categories/foot-protection/safety-boots
                    - text: for three-point access, inspection, samples, chains, rough ground, mud, fuel or oil contact, and weather.
                - listitem [ref=e365]: Store PPE so it remains clean, reachable, and undamaged in the cab; do not leave emergency or required gear buried behind loose items.
              - paragraph [ref=e366]:
                - text: MSHA's
                - link "Powered Haulage Equipment Safety Guidance" [ref=e367] [cursor=pointer]:
                  - /url: https://www.msha.gov/sites/default/files/events/Powered%20Haulage%20Guidance.pdf
                - text: treats visibility, communication, traffic management, road condition, seat belts, and pre-operational examination as connected controls. Use that systems view rather than reducing haul-road safety to a reflective vest.
              - heading "Maintenance PPE Checklist" [level=2] [ref=e368]
              - paragraph [ref=e369]: Maintenance includes inspections, lubrication, belt work, liner changes, welding, grinding, electrical troubleshooting, tyre or wheel work, hydraulic repair, elevated access, confined spaces, and chemical cleaning. Do not start with a generic mechanic kit; start with the work scope and every energy source.
              - figure "Maintenance PPE is selected only after shutdown scope, energy isolation, verification, blocking, permits, and access are defined." [ref=e370]:
                - img "Maintenance PPE is selected only after shutdown scope, energy isolation, verification, blocking, permits, and access are defined." [ref=e372]
              - heading "Isolation and permit check" [level=3] [ref=e374]
              - list [ref=e375]:
                - listitem [ref=e376]: Has the equipment been shut down under the mine's procedure?
                - listitem [ref=e377]: Have electrical, mechanical, hydraulic, pneumatic, thermal, chemical, pressure, spring, rotating, suspended, and gravitational energy sources been identified?
                - listitem [ref=e378]: Are disconnects isolated and locked or tagged as required, with stored energy released, restrained, grounded, or blocked?
                - listitem [ref=e379]: Has isolation been verified before guards are removed or work begins?
                - listitem [ref=e380]: Are raised components, counterweights, hoppers, chutes, conveyors, and mobile equipment securely blocked against movement?
                - listitem [ref=e381]: Are hot-work, electrical, work-at-height, confined-space, lifting, line-breaking, or chemical permits required?
                - listitem [ref=e382]: Is the work area barricaded, with start-up controls and responsibility for return to service clear?
              - heading "PPE and issue check" [level=3] [ref=e383]
              - list [ref=e384]:
                - listitem [ref=e385]: Select primary eye protection and task-specific face protection for grinding, cutting, chipping, fluid release, splash, or hot work.
                - listitem [ref=e386]: Select gloves separately for cut, impact, grip, chemical, thermal, welding, or electrical tasks. Do not use a glove outside its intended protection, and reassess entanglement near rotating parts.
                - listitem [ref=e387]: Select hearing protection for tool and plant noise while preserving required communication.
                - listitem [ref=e388]: Select respiratory protection for welding fume, dust, coatings, chemicals, or confined work only through the exposure assessment and written program.
                - listitem [ref=e389]: Confirm head protection, footwear, clothing, and knee or body protection against overhead work, dropped parts, sharp edges, hot surfaces, oil, mud, and access conditions.
                - listitem [ref=e390]: Use welding, electrical, arc-rated, chemical, fall-protection, or confined-space equipment only under the specialist procedure with the correct ratings, compatibility, inspection, and rescue provisions.
              - paragraph [ref=e391]:
                - text: For U.S. surface metal and nonmetal mines,
                - link "30 CFR 56.12016" [ref=e392] [cursor=pointer]:
                  - /url: https://www.ecfr.gov/current/title-30/chapter-I/subchapter-K/part-56/subpart-K/section-56.12016
                - text: addresses de-energizing and locking out electrically powered equipment before mechanical work, with limited qualified-person exceptions. Site and jurisdiction requirements may be broader.
              - heading "How Supervisors Turn the Checklist Into Role Kits" [level=2] [ref=e393]
              - paragraph [ref=e394]: The goal is not six oversized kits. Build a controlled baseline plus task modules.
              - figure "A controlled baseline plus task modules helps supervisors issue PPE without creating one oversized kit for every mine worker." [ref=e395]:
                - img "A controlled baseline plus task modules helps supervisors issue PPE without creating one oversized kit for every mine worker." [ref=e397]
              - table [ref=e400]:
                - rowgroup [ref=e401]:
                  - row [ref=e402]:
                    - columnheader "Kit layer" [ref=e403]
                    - columnheader "Typical contents" [ref=e404]
                    - columnheader "Issue rule" [ref=e405]
                - rowgroup [ref=e406]:
                  - row [ref=e407]:
                    - cell "Mine-site baseline" [ref=e408]
                    - cell "Site-approved head protection, everyday eye protection, visibility garment, protective footwear, basic hearing protection where designated" [ref=e409]
                    - cell "Issued by role and work area; fit and compatibility recorded" [ref=e410]
                  - row [ref=e411]:
                    - cell "Drilling module" [ref=e412]
                    - cell "Sealed or task-selected eye protection, hearing option, approved respirator and consumables where required, task-selected gloves" [ref=e413]
                    - cell "Released only for the specified drill, material, controls, and exposure conditions" [ref=e414]
                  - row [ref=e415]:
                    - cell "Processing module" [ref=e416]
                    - cell "Dust or splash eye/face protection, hearing option, respiratory consumables where required, wet/chemical/task glove options" [ref=e417]
                    - cell "Matched to operating, sampling, cleanup, or reagent-handling role" [ref=e418]
                  - row [ref=e419]:
                    - cell "Haul-road module" [ref=e420]
                    - cell "Outer-layer hi-vis, clean eyewear, weather gear, outside-cab hearing or respiratory PPE where assessed" [ref=e421]
                    - cell "Stored and inspected for drivers, spotters, pedestrians, and inspection crews" [ref=e422]
                  - row [ref=e423]:
                    - cell "Maintenance module" [ref=e424]
                    - cell "Task eye/face protection, glove options, hearing, respirator components, welding/electrical/fall/chemical PPE under permit" [ref=e425]
                    - cell "Controlled by job scope, authorization, isolation, and specialist procedure" [ref=e426]
                  - row [ref=e427]:
                    - cell "Replacement stock" [ref=e428]
                    - cell "Lenses, eyewear, earplugs, earmuff cushions, respirator filters or cartridges, straps, sweatbands, gloves, garments, laces and approved spare parts" [ref=e429]
                    - cell "Reorder points based on use, contamination, damage, shelf life, lead time, and workforce size" [ref=e430]
              - paragraph [ref=e431]:
                - text: Use the
                - link "PPE quantity calculator" [ref=e432] [cursor=pointer]:
                  - /url: /tools/ppe-calculator
                - text: to convert headcount, issue frequency, and replacement assumptions into quantities. Keep the calculation separate by task module so high-use consumables do not distort the entire mine order.
              - paragraph [ref=e433]:
                - text: For each line item in an RFQ, record the task, work area, hazard, required product standard or approval, model documentation, size range, compatibility, packaging, spare parts, inspection criteria, replacement trigger, sample approval, and permitted substitutions. Then submit the reviewed specification through the
                - link "quote request" [ref=e434] [cursor=pointer]:
                  - /url: /quote
                - text: .
              - heading "Common Mining PPE Checklist Mistakes" [level=2] [ref=e435]
              - list [ref=e436]:
                - listitem [ref=e437]:
                  - generic [ref=e438]:
                    - strong [ref=e439]: Issuing one mine-wide kit.
                    - text: A standard baseline can help, but drilling, blasting, crushing, screening, transport, and maintenance need different task modules.
                - listitem [ref=e440]:
                  - generic [ref=e441]:
                    - strong [ref=e442]: Using PPE to close a control gap.
                    - text: A vest does not fix an uncontrolled traffic route; a respirator does not replace required dust controls; gloves do not make exposed moving parts safe.
                - listitem [ref=e443]:
                  - generic [ref=e444]:
                    - strong [ref=e445]: Choosing respirators from the word "silica."
                    - text: Selection needs contaminant and exposure data, controls, approval, medical evaluation, fit, training, and a written program.
                - listitem [ref=e446]:
                  - generic [ref=e447]:
                    - strong [ref=e448]: Ignoring glove entanglement.
                    - text: More hand protection is not always safer near rotating or moving components. Follow the equipment manufacturer and mine procedure.
                - listitem [ref=e449]:
                  - generic [ref=e450]:
                    - strong [ref=e451]: Treating a face shield as primary eye protection.
                    - text: Confirm whether safety glasses or goggles are also required for the task.
                - listitem [ref=e452]:
                  - generic [ref=e453]:
                    - strong [ref=e454]: Leaving compatibility until after delivery.
                    - text: Test helmet, eyewear, earmuff, respirator, lamp, garment, and face-shield combinations before a bulk order.
                - listitem [ref=e455]:
                  - generic [ref=e456]:
                    - strong [ref=e457]: Using a fixed post-blast re-entry time.
                    - text: Re-entry belongs to the blast procedure, authorized inspection, ventilation, monitoring, and site conditions—not a generic blog rule.
                - listitem [ref=e458]:
                  - generic [ref=e459]:
                    - strong [ref=e460]: Buying specialist PPE without the specialist program.
                    - text: Electrical, arc-flash, welding, fall-protection, chemical, and respiratory equipment require trained selection and use.
                - listitem [ref=e461]:
                  - generic [ref=e462]:
                    - strong [ref=e463]: Tracking issue but not removal.
                    - text: Record damage, contamination, failed fit, expiry, missing parts, and replacement so unsuitable equipment does not return to service.
              - 'heading "Supervisor Sign-Off: A Short Start-of-Shift Record" [level=2] [ref=e464]'
              - paragraph [ref=e465]: "Before releasing the crew, record:"
              - list [ref=e466]:
                - listitem [ref=e467]: Task, location, equipment, shift, and supervisor.
                - listitem [ref=e468]: Work-area and equipment examination completed.
                - listitem [ref=e469]: Critical controls operating and any restrictions.
                - listitem [ref=e470]: Exposure data or program used for respiratory and hearing decisions.
                - listitem [ref=e471]: Task module issued by role and size.
                - listitem [ref=e472]: Compatibility and condition check completed.
                - listitem [ref=e473]: Authorization, permit, or specialist review confirmed where required.
                - listitem [ref=e474]: Communication, exclusion, traffic, and emergency arrangements confirmed.
                - listitem [ref=e475]: Stop-work and checklist-repeat triggers explained.
                - listitem [ref=e476]: Damaged equipment quarantined and replacement stock available.
              - paragraph [ref=e477]: Keep this record with the mine's own pre-start, task training, permit, and inspection documents. It is a bridge between the hazard-control system and PPE issue—not a replacement for those records.
              - heading "Frequently Asked Questions" [level=2] [ref=e478]
              - heading "Is there one standard PPE checklist for every mine worker?" [level=3] [ref=e479]
              - paragraph [ref=e480]: No. A site can define baseline PPE, but the final checklist depends on mine type, task, work area, equipment, measured exposure, traffic interaction, local rules, and the mine's procedures. Build task modules for drilling, blasting, processing, haulage, and maintenance instead of forcing one universal kit.
              - heading "Is an N95 enough for drilling or crusher dust?" [level=3] [ref=e481]
              - paragraph [ref=e482]: The task name is not enough to answer. The mine must identify the contaminant, measure or otherwise assess exposure as required, use feasible controls, and select an approved respirator with the necessary protection under a written program. U.S. mine teams should check current MSHA requirements; other jurisdictions may differ.
              - heading "Should drill operators always wear anti-vibration gloves?" [level=3] [ref=e483]
              - paragraph [ref=e484]: No universal glove recommendation replaces tool selection, maintenance, exposure reduction, work practices, and the equipment manufacturer's instructions. A glove must preserve control and fit, have relevant task data, and not introduce entanglement near rotating components.
              - heading "What PPE should workers wear during blasting?" [level=3] [ref=e485]
              - paragraph [ref=e486]: Only authorized roles should be involved, under the mine's blast procedure. Blast-area clearance, guarding, warning, evacuation, and post-blast inspection come before PPE. The PPE itself depends on the person's role, location, preparation work, re-entry conditions, and applicable rules.
              - heading "Can crusher operators and maintenance workers share the same PPE kit?" [level=3] [ref=e487]
              - paragraph [ref=e488]: They can share approved baseline items, but maintenance often adds isolation-dependent eye and face, hand, respiratory, welding, electrical, chemical, fall, or confined-space requirements. Create a separate maintenance module controlled by the job scope and permit.
              - heading "How often should the checklist be reviewed?" [level=3] [ref=e489]
              - paragraph [ref=e490]: Review it whenever the task, equipment, material, control method, location, shift, route, weather, exposure result, product model, incident learning, legal requirement, or manufacturer instruction changes. Also set a scheduled review under the mine's management system.
              - paragraph [ref=e496]:
                - strong [ref=e497]: Need a role-based mine or quarry PPE list?
                - text: Send the task map, workforce by role, work areas, exposure information, required standards, size range, documentation needs, and replacement assumptions. LAIFAPPE can organize available products and document samples into a buyer review list before quotation; the mine operator remains responsible for hazard assessment, final selection, training, fit, and use.

          - article [ref=e124]:
            - generic [ref=e125]:
              - paragraph [ref=e126]: Construction gloves are one of the most common PPE items on any jobsite, and also one of the most commonly misselected.
              - paragraph [ref=e127]: Many sites buy one glove for everyone and assume the hand-protection problem is solved. It is not. The glove that works for moving drywall is not the glove for tying rebar. The glove that works for rough framing is not the glove for wet cement, solvents, welding, or electrical exposure. A glove that improves grip on one task can reduce dexterity on another. A glove that protects well against abrasion may perform badly against chemical splash. A glove that feels strong may still be the wrong choice for sharp sheet metal or energized work.
              - paragraph [ref=e128]:
                - text: That is why glove selection should start with hazard matching, not with price or habit. Use this guide when you need to choose the right construction gloves by task, material, coating, cut risk, impact exposure, and site conditions. For the wider site-wide PPE mix, use
                - link "Complete PPE Solution for Construction Sites" [ref=e129] [cursor=pointer]:
                  - /url: /solutions/construction-site-ppe-solution
                - text: . For the regulation-first view, use
                - link "OSHA PPE Requirements for Construction" [ref=e130] [cursor=pointer]:
                  - /url: /blog/osha-ppe-requirements-construction
                - text: . For field issue and pre-start checks, use
                - link "Construction PPE Checklist" [ref=e131] [cursor=pointer]:
                  - /url: /blog/construction-ppe-checklist
                - text: .
              - heading "Why Construction Glove Selection Is Harder Than It Looks" [level=2] [ref=e137]
              - paragraph [ref=e138]: "Hand exposure on construction sites comes from many different directions at the same time:"
              - list [ref=e139]:
                - listitem [ref=e140]: rough materials that abrade skin and wear out coatings
                - listitem [ref=e141]: sharp edges that cut or puncture
                - listitem [ref=e142]: repeated lifting that creates grip and fatigue problems
                - listitem [ref=e143]: wet cement, adhesives, solvents, fuels, and sealants
                - listitem [ref=e144]: hot work, sparks, and heated surfaces
                - listitem [ref=e145]: cold weather, wet weather, and reduced dexterity
                - listitem [ref=e146]: vibration, awkward tool use, and reduced fine control
                - listitem [ref=e147]: electrical contact risk in specific tasks
              - paragraph [ref=e148]: "Because the exposures overlap, glove selection is rarely about one feature. Buyers and supervisors usually have to balance four things together:"
              - list [ref=e149]:
                - listitem [ref=e150]: the main hazard
                - listitem [ref=e151]: the level of dexterity needed
                - listitem [ref=e152]: the environment, such as wet, oily, dusty, cold, or hot conditions
                - listitem [ref=e153]: how the glove fits with the rest of the worker's PPE and tools
              - paragraph [ref=e154]:
                - text: A glove that is too bulky slows work and gets removed. A glove that is too thin tears early. A glove that is too loose can create snag risk. A glove that is too tight reduces circulation and hand control. Since OSHA made proper fit explicit in construction PPE selection effective
                - strong [ref=e155]: January 13, 2025
                - text: ", glove sizing is not just a comfort issue anymore."
              - heading "What OSHA Requires for Construction Gloves" [level=2] [ref=e156]
              - paragraph [ref=e157]: OSHA's construction standards do not treat gloves as a one-size-fits-all site item. They treat glove selection as a hazard-control decision.
              - figure "Construction glove compliance starts with hazard matching, fit, and task-specific PPE selection rather than a generic issue policy." [ref=e158]:
                - img "Construction glove compliance starts with hazard matching, fit, and task-specific PPE selection rather than a generic issue policy." [ref=e160]
                - generic [ref=e161]: Construction glove compliance starts with hazard matching, fit, and task-specific PPE selection rather than a generic issue policy.
              - paragraph [ref=e162]: "The key construction rules are:"
              - list [ref=e163]:
                - listitem [ref=e164]:
                  - generic [ref=e165]:
                    - strong [ref=e166]: 29 CFR 1926.28(a)
                    - text: ": the employer must require appropriate PPE wherever employees are exposed to hazardous conditions."
                - listitem [ref=e167]:
                  - generic [ref=e168]:
                    - strong [ref=e169]: 29 CFR 1926.95(a)
                    - text: ": extremity protection must be provided, used, and maintained wherever hazards from the work or environment can cause injury through physical contact, absorption, or other exposure."
                - listitem [ref=e170]:
                  - generic [ref=e171]:
                    - strong [ref=e172]: 29 CFR 1926.95(c)
                    - text: ": PPE has to be of safe design and, since the 2025 revision became effective on"
                    - strong [ref=e173]: January 13, 2025
                    - text: ", selected so that it properly fits each affected employee."
              - paragraph [ref=e174]:
                - text: That structure matters because construction does
                - strong [ref=e175]: not
                - text: "give glove selection a neat, stand-alone glove section in Subpart E the way it does for footwear, head, eye, hearing, or respiratory protection. In practice, construction glove compliance usually sits on three layers:"
              - list [ref=e176]:
                - listitem [ref=e177]:
                  - generic [ref=e178]:
                    - text: the broad duty under
                    - code [ref=e179]: 1926.28(a)
                    - text: to require appropriate PPE where the hazard exists
                - listitem [ref=e180]:
                  - generic [ref=e181]:
                    - text: the PPE selection and fit rules under
                    - code [ref=e182]: "1926.95"
                - listitem [ref=e183]:
                  - generic [ref=e184]:
                    - text: the task-specific standard where one exists, such as electrical protective equipment under
                    - code [ref=e185]: "1926.97"
                    - text: or certain electrical work provisions under
                    - code [ref=e186]: "1926.416"
              - paragraph [ref=e187]: "That means glove selection in construction is hazard-based:"
              - list [ref=e188]:
                - listitem [ref=e189]: if the task creates a real hand hazard, appropriate glove protection is required
                - listitem [ref=e190]: if the exposure changes from abrasion to cut, chemical, heat, or electrical risk, the glove choice may need to change too
                - listitem [ref=e191]: if the glove creates a new hazard because it is too loose, too bulky, contaminated, or incompatible with the tool or material, that is still a selection failure
              - paragraph [ref=e192]: "There are also task-specific OSHA points construction teams should keep in view:"
              - list [ref=e193]:
                - listitem [ref=e194]:
                  - generic [ref=e195]:
                    - strong [ref=e196]: Electrical work
                    - text: is not a normal glove decision. When the job calls for electrical protection, insulating gloves have to be selected, used, and maintained as electrical PPE rather than treated like ordinary site gloves.
                - listitem [ref=e197]:
                  - generic [ref=e198]:
                    - strong [ref=e199]: Underground or concealed line exposure
                    - text: can trigger more specific hand-protection requirements. For example, OSHA states in
                    - code [ref=e200]: 1926.416(a)(1)
                    - text: that when employees use jackhammers, bars, or other hand tools where underground powerline locations are unknown, they must be provided with insulated protective gloves.
                - listitem [ref=e201]:
                  - generic [ref=e202]:
                    - strong [ref=e203]: Masonry and wet cement work
                    - text: "remains performance-oriented under OSHA. In its interpretation letter on masons, OSHA refused to grant a formal exemption from the general PPE rule, but also stated that not every masonry task automatically requires gloves. The actual trigger is the hazard assessment: if employees are exposed to wet cement or other hand hazards, glove protection is required; if that specific hazard is not present, a blanket glove rule is not what the standard says."
                - listitem [ref=e204]:
                  - generic [ref=e205]:
                    - strong [ref=e206]: Ordinary weather gloves
                    - text: are not the same thing as hazard-matched PPE. OSHA expressly distinguishes ordinary gloves worn only for weather from protective gloves selected for workplace hazards.
              - paragraph [ref=e207]: "The professional way to read OSHA here is simple: construction glove compliance is not about proving that every worker owns a pair of gloves. It is about proving that the glove on the worker's hand matches the hazard of the task being performed."
              - heading "The Main Glove Hazards on Construction Sites" [level=2] [ref=e213]
              - paragraph [ref=e214]: Before you choose a glove, identify the dominant hazard. This sounds basic, but it is the step most sites shortcut.
              - figure "Construction hand hazards often overlap, which is why glove choice has to balance cut, abrasion, impact, wet work, and dexterity together." [ref=e215]:
                - img "Construction hand hazards often overlap, which is why glove choice has to balance cut, abrasion, impact, wet work, and dexterity together." [ref=e217]
                - generic [ref=e218]: Construction hand hazards often overlap, which is why glove choice has to balance cut, abrasion, impact, wet work, and dexterity together.
              - heading "Abrasion and rough handling" [level=3] [ref=e219]
              - paragraph [ref=e220]: This is the most common exposure on general construction sites. Handling block, brick, lumber, formwork, rebar, scaffolding parts, cable, or rough metal edges wears down skin quickly and destroys weak gloves fast.
              - paragraph [ref=e221]: "What matters:"
              - list [ref=e222]:
                - listitem [ref=e223]: palm coating durability
                - listitem [ref=e224]: grip under dust or light moisture
                - listitem [ref=e225]: basic abrasion resistance
                - listitem [ref=e226]: enough flexibility for repeated lifting and carrying
              - heading "Cuts and lacerations" [level=3] [ref=e227]
              - paragraph [ref=e228]: Sharp sheet metal, strap ends, cut wire, flashing, glass, metal studs, rebar tie wire, and power-tool-adjacent tasks can all create real laceration risk.
              - paragraph [ref=e229]: "What matters:"
              - list [ref=e230]:
                - listitem [ref=e231]: cut-resistant liner
                - listitem [ref=e232]: whether the cut is from edges, burrs, or blades
                - listitem [ref=e233]: whether dexterity is still good enough for the task
              - paragraph [ref=e234]: Sites often overbuy cut resistance for low-risk tasks and underbuy it for sheet metal, glazing, and metal framing work.
              - heading "Punctures" [level=3] [ref=e235]
              - paragraph [ref=e236]: Puncture hazards behave differently from straight cuts. Wire ends, nails, metal offcuts, protrusions, and thorn-like debris can defeat gloves that test well for abrasion or basic cut resistance.
              - paragraph [ref=e237]: "What matters:"
              - list [ref=e238]:
                - listitem [ref=e239]: puncture-focused performance
                - listitem [ref=e240]: palm thickness and reinforcement
                - listitem [ref=e241]: whether the glove is meant for handling rough hardware rather than fine assembly
              - heading "Impact and crush exposure" [level=3] [ref=e242]
              - paragraph [ref=e243]: General material handling does not always require impact gloves, but some tasks do. Work around pipe, rigging, heavy components, demolition, steel handling, and powered tools can create repeated back-of-hand strike and pinch exposure.
              - paragraph [ref=e244]: "What matters:"
              - list [ref=e245]:
                - listitem [ref=e246]: TPR or other back-of-hand protection
                - listitem [ref=e247]: flexibility around the knuckles
                - listitem [ref=e248]: whether the bulk interferes with grip or trigger control
              - heading "Wet cement, chemicals, and skin irritation" [level=3] [ref=e249]
              - paragraph [ref=e250]: Wet concrete and mortar are common construction skin hazards, and many teams underestimate them because they are so familiar. Add adhesives, sealants, cleaning agents, fuels, coatings, and solvents, and the glove decision becomes very different from normal material handling.
              - paragraph [ref=e251]: "What matters:"
              - list [ref=e252]:
                - listitem [ref=e253]: chemical resistance to the actual substance
                - listitem [ref=e254]: cuff length and splash control
                - listitem [ref=e255]: whether the task is brief contact or extended exposure
                - listitem [ref=e256]: whether disposable gloves are being used correctly or as a false economy
              - paragraph [ref=e257]: No glove material protects against every chemical. For chemical work, manufacturer compatibility data matters more than general category labels.
              - heading "Heat, sparks, and hot work" [level=3] [ref=e258]
              - paragraph [ref=e259]: Welding, cutting, torch work, grinding near heat, and handling hot materials call for gloves chosen for thermal performance, not just abrasion.
              - paragraph [ref=e260]: "What matters:"
              - list [ref=e261]:
                - listitem [ref=e262]: heat resistance
                - listitem [ref=e263]: spark and spatter resistance
                - listitem [ref=e264]: cuff and wrist coverage
                - listitem [ref=e265]: balance between thermal protection and dexterity
              - heading "Electrical exposure" [level=3] [ref=e266]
              - paragraph [ref=e267]: Most gloves on a construction site are not electrical gloves. This is where a lot of confusion starts.
              - paragraph [ref=e268]: "What matters:"
              - list [ref=e269]:
                - listitem [ref=e270]: whether the task involves actual electrical protection
                - listitem [ref=e271]: whether the glove is insulating rubber or only general hand protection
                - listitem [ref=e272]: whether leather protectors are required over the insulating glove
              - paragraph [ref=e273]: If the task creates true electrical contact risk, the glove choice must be built around electrical standards, not around general cut or grip features.
              - heading "The Main Types of Construction Gloves" [level=2] [ref=e279]
              - paragraph [ref=e280]: Once the hazard is clear, the next question is glove family. Most construction glove selection falls into these groups.
              - figure "General handling gloves, cut gloves, impact gloves, chemical gloves, welding gloves, and insulating gloves all serve different construction tasks." [ref=e281]:
                - img "General handling gloves, cut gloves, impact gloves, chemical gloves, welding gloves, and insulating gloves all serve different construction tasks." [ref=e283]
                - generic [ref=e284]: General handling gloves, cut gloves, impact gloves, chemical gloves, welding gloves, and insulating gloves all serve different construction tasks.
              - heading "General-purpose coated knit gloves" [level=3] [ref=e285]
              - paragraph [ref=e286]: "These are the most common site gloves for good reason. They are light, relatively low-cost, and easy to issue in volume. Most are used for:"
              - list [ref=e287]:
                - listitem [ref=e288]: general labor
                - listitem [ref=e289]: light material handling
                - listitem [ref=e290]: carpentry support
                - listitem [ref=e291]: logistics and cleanup
                - listitem [ref=e292]: dry or slightly damp tasks needing grip
              - paragraph [ref=e293]: "They work best when the site needs:"
              - list [ref=e294]:
                - listitem [ref=e295]: good grip
                - listitem [ref=e296]: decent dexterity
                - listitem [ref=e297]: moderate abrasion resistance
                - listitem [ref=e298]: manageable replacement cost
              - paragraph [ref=e299]: They work poorly when the site actually needs strong cut, chemical, heat, or electrical protection.
              - heading "Cut-resistant gloves" [level=3] [ref=e300]
              - paragraph [ref=e301]: "These are used where sharp edges are not occasional but central to the task. Common use cases include:"
              - list [ref=e302]:
                - listitem [ref=e303]: sheet metal and metal stud work
                - listitem [ref=e304]: glazing and sharp-edge handling
                - listitem [ref=e305]: rebar tying and wire-heavy work
                - listitem [ref=e306]: demolition sorting with sharp debris
                - listitem [ref=e307]: ducting and flashing installation
              - paragraph [ref=e308]: The common mistake is assuming higher cut rating is always better. Often it is not. Heavier cut gloves can reduce dexterity and slow tasks that need feel and control. The correct choice is usually the lowest rating that still credibly matches the hazard.
              - heading "Impact gloves" [level=3] [ref=e309]
              - paragraph [ref=e310]: "These are used where the back of the hand is at repeated risk from knocks, pinches, and crush contact. Common use cases include:"
              - list [ref=e311]:
                - listitem [ref=e312]: rigging and lifting support
                - listitem [ref=e313]: steel handling
                - listitem [ref=e314]: demolition
                - listitem [ref=e315]: heavy material movement
                - listitem [ref=e316]: equipment-adjacent work
              - paragraph [ref=e317]: They are useful, but not universal. On some tasks they improve protection. On others they are too bulky and reduce tool control.
              - heading "Leather gloves" [level=3] [ref=e318]
              - paragraph [ref=e319]: "Leather remains common in construction because it is tough, familiar, and useful in many rough-handling tasks. Leather gloves are often chosen for:"
              - list [ref=e320]:
                - listitem [ref=e321]: rough material handling
                - listitem [ref=e322]: abrasive tasks
                - listitem [ref=e323]: welding support
                - listitem [ref=e324]: rope, cable, and rigging contact
                - listitem [ref=e325]: outdoor use where durability matters more than fine dexterity
              - paragraph [ref=e326]: They are not chemical gloves, and they are not the right answer where wet cement, solvents, or electrical insulation is the real exposure.
              - heading "Chemical-resistant gloves" [level=3] [ref=e327]
              - paragraph [ref=e328]: "These are chosen by substance, not by appearance. Common materials include nitrile, neoprene, butyl, latex, and other synthetic rubbers. Use cases include:"
              - list [ref=e329]:
                - listitem [ref=e330]: wet cement and mortar
                - listitem [ref=e331]: adhesives and sealants
                - listitem [ref=e332]: solvents and cleaners
                - listitem [ref=e333]: coatings, fuels, oils, and degreasers
              - paragraph [ref=e334]: For these tasks, the first question is not "which glove feels strongest?" It is "which glove is compatible with the substance and duration of exposure?"
              - heading "Welding and heat-resistant gloves" [level=3] [ref=e335]
              - paragraph [ref=e336]: "These are specialized gloves for:"
              - list [ref=e337]:
                - listitem [ref=e338]: welding
                - listitem [ref=e339]: torch cutting
                - listitem [ref=e340]: hot metal handling
                - listitem [ref=e341]: spark-heavy tasks
              - paragraph [ref=e342]: They need more wrist and forearm protection, better heat resistance, and material that holds up under thermal exposure. They are usually the wrong glove for precision mechanical work.
              - heading "Rubber insulating gloves" [level=3] [ref=e343]
              - paragraph [ref=e344]: These are for electrical protection, not general site wear. They are used in electrical work where insulating performance is required. They should be treated as a separate category entirely from normal site gloves.
              - paragraph [ref=e345]: If your site is evaluating electrical exposures, the glove decision belongs alongside the wider electrical PPE plan, not inside the general glove drawer.
              - heading "How To Read Construction Glove Labels and Standards" [level=2] [ref=e351]
              - paragraph [ref=e352]: Construction buyers often look at glove labels without knowing which marking actually helps them compare products. The useful question is not "does this glove have a standard logo?" The useful question is "which test result on this glove actually maps to my hazard?"
              - figure "Standards only help when the buyer knows which test result actually maps to the hand hazard on site." [ref=e353]:
                - img "Standards only help when the buyer knows which test result actually maps to the hand hazard on site." [ref=e355]
                - generic [ref=e356]: Standards only help when the buyer knows which test result actually maps to the hand hazard on site.

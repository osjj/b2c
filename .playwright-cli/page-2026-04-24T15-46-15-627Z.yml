                - strong [ref=e392]: inside the right category
                - text: . They do not make one glove universal.
              - heading "How skilled buyers actually use these standards" [level=3] [ref=e393]
              - list [ref=e394]:
                - listitem [ref=e395]:
                  - generic [ref=e396]:
                    - text: For
                    - strong [ref=e397]: mechanical handling
                    - text: ", compare the abrasion, cut, puncture, and impact performance that fits the job rather than buying the highest score available."
                - listitem [ref=e398]:
                  - generic [ref=e399]:
                    - text: For
                    - strong [ref=e400]: chemical work
                    - text: ", check the actual substance, the expected contact pattern, and the manufacturer's compatibility data. A chemical glove is not chosen by brand, thickness, or color."
                - listitem [ref=e401]:
                  - generic [ref=e402]:
                    - text: For
                    - strong [ref=e403]: hot work
                    - text: ", check whether the glove is built for thermal exposure or just rough handling."
                - listitem [ref=e404]:

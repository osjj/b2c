              - heading "General labor" [level=3] [ref=e557]
              - paragraph [ref=e558]: "Most general labor tasks do not need the heaviest glove on the market. What they need is consistency:"
              - list [ref=e559]:
                - listitem [ref=e560]: good fit
                - listitem [ref=e561]: dependable grip
                - listitem [ref=e562]: acceptable durability
                - listitem [ref=e563]: low enough cost to replace before failure
              - paragraph [ref=e564]: This is the place where coated knit gloves usually make sense.
              - heading "Concrete and masonry" [level=3] [ref=e565]
              - paragraph [ref=e566]: This category gets misjudged constantly. Teams focus on abrasion and forget skin exposure from wet cement and mortar. If the worker's hands are contacting wet material, chemical and dermal protection matters, not just toughness.
              - paragraph [ref=e567]: "The professional selection questions are:"
              - list [ref=e568]:
                - listitem [ref=e569]: Is the worker actually touching wet cement, mortar, grout, or admixture?
                - listitem [ref=e570]: Is the contact brief and occasional, or repeated through the shift?
                - listitem [ref=e571]: Does the glove need to resist chemical irritation while still surviving block, trowel, and rough-surface handling?
                - listitem [ref=e572]: Does the cuff protect the wrist from slurry intrusion?
              - paragraph [ref=e573]:
                - text: This is also where OSHA's masonry interpretation becomes useful. OSHA did
                - strong [ref=e574]: not
                - text: say masons automatically need gloves on every task. It said the hazard assessment controls the answer, and where wet cement exposure creates dermal hazard, glove protection is part of the response.
              - paragraph [ref=e575]: In practice, many sites fail here because they issue a normal coated glove that grips block well but offers weak protection once the hand is repeatedly exposed to wet cement.
              - heading "Steel, rebar, and sheet metal" [level=3] [ref=e576]
              - paragraph [ref=e577]: This is where sites often need more cut performance than they realize. But the glove still has to let the worker tie, grip, place, and control material. Overly stiff gloves create a new problem.
              - paragraph [ref=e578]: "The practical selection logic is:"
              - list [ref=e579]:
                - listitem [ref=e580]:
                  - generic [ref=e581]:
                    - text: choose for the
                    - strong [ref=e582]: real edge condition
                    - text: ", not just the idea of \"metal work\""
                - listitem [ref=e583]: separate jobs that need repeated hand feel from jobs that can tolerate a heavier glove
                - listitem [ref=e584]: check puncture and palm wear, not only cut claims
                - listitem [ref=e585]: expect faster replacement if the glove is doing constant wire, flashing, or stud work
              - paragraph [ref=e586]: This is also where teams often realize they need more than one "metal-work glove." Rebar tying, sheet metal handling, metal stud framing, and demolition sorting can all look similar at a distance and still need different balances of cut performance, puncture resistance, grip, and dexterity.
              - heading "Welding and hot work" [level=3] [ref=e587]
              - paragraph [ref=e588]: Do not solve these tasks with normal site gloves. Choose for heat and spark exposure first, then check whether the worker still has enough control for the job.
              - paragraph [ref=e589]: "Good buying questions include:"
              - list [ref=e590]:
                - listitem [ref=e591]: does the process create sparks only, or real sustained heat?
                - listitem [ref=e592]: how much cuff length is needed?
                - listitem [ref=e593]: is the worker welding, cutting, handling hot metal, or switching between tasks?
                - listitem [ref=e594]: can the user still maintain enough control for the process?
              - paragraph [ref=e595]: Leather gloves may be useful here, but "leather" by itself is not the whole answer. The glove still has to match the heat level, wrist exposure, and dexterity requirement.
              - heading "Electrical work" [level=3] [ref=e596]
              - paragraph [ref=e597]: Do not assume "rubberized" means electrically protective. If the glove is part of electrical protection, it has to be treated as electrical PPE, with the right class, inspection, storage, and use practices.
              - paragraph [ref=e598]: "This is a hard line:"
              - list [ref=e599]:
                - listitem [ref=e600]: coated gloves are not the same thing as insulating gloves
                - listitem [ref=e601]: general hand protection is not the same thing as electrical PPE
                - listitem [ref=e602]: rubber insulating gloves belong in a controlled inspection and storage program, not in the same issue logic as general handling gloves
              - paragraph [ref=e603]: If the task creates actual electrical exposure, the site should move out of normal glove selection and into the electrical PPE system entirely.
              - heading "Demolition and mixed debris work" [level=3] [ref=e604]
              - paragraph [ref=e605]: Demolition is where glove selection often breaks down because the hazard profile changes hour by hour.
              - paragraph [ref=e606]: "One debris stream may be mostly:"
              - list [ref=e607]:
                - listitem [ref=e608]: broken sharp material
                - listitem [ref=e609]: jagged metal
                - listitem [ref=e610]: splintered wood
                - listitem [ref=e611]: abrasive concrete
              - paragraph [ref=e612]: "The next may involve:"
              - list [ref=e613]:
                - listitem [ref=e614]: heavy pieces
                - listitem [ref=e615]: crush contact
                - listitem [ref=e616]: awkward lifting
                - listitem [ref=e617]: contaminated surfaces
              - paragraph [ref=e618]: "That is why demolition teams often need at least two glove tracks instead of one: one biased toward cut and abrasion, and one biased toward impact and heavier handling."
              - heading "Glove Fit, Dexterity, and Worker Compliance" [level=2] [ref=e624]
              - paragraph [ref=e625]: A glove can look correct on paper and still fail in the field because workers hate using it.
              - paragraph [ref=e626]: "Common reasons gloves get removed or misused:"
              - list [ref=e627]:
                - listitem [ref=e628]: fingers are too long
                - listitem [ref=e629]: palm is too loose
                - listitem [ref=e630]: coating is too slick for the material
                - listitem [ref=e631]: glove is too bulky for fasteners, clips, or trigger work
                - listitem [ref=e632]: cuff catches on clothing or tools
                - listitem [ref=e633]: heat buildup is too high in warm conditions
              - paragraph [ref=e634]: That is why proper fit matters in construction PPE. Oversized gloves are not just annoying. OSHA specifically noted that poorly fitted gloves can create additional hazards, including getting caught in machinery.
              - paragraph [ref=e635]: "For site managers and buyers, this means:"
              - list [ref=e636]:
                - listitem [ref=e637]: stock multiple sizes, not one default size
                - listitem [ref=e638]: check fit on the actual users, not just on a sample hand
                - listitem [ref=e639]: separate high-dexterity tasks from heavy-handling tasks
                - listitem [ref=e640]: treat worker rejection as a selection signal, not just a behavior problem
              - heading "What a Real Construction Glove Program Usually Stocks" [level=2] [ref=e641]
              - paragraph [ref=e642]: One of the easiest ways to improve both safety and procurement efficiency is to stop thinking in terms of "the site glove" and start thinking in terms of a small glove program.
              - paragraph [ref=e643]: "For many construction operations, a practical glove mix looks like this:"
              - list [ref=e644]:
                - listitem [ref=e645]:
                  - generic [ref=e646]:
                    - text: one
                    - strong [ref=e647]: general-purpose coated glove
                    - text: for baseline handling work
                - listitem [ref=e648]:
                  - generic [ref=e649]:
                    - text: one
                    - strong [ref=e650]: higher-cut glove
                    - text: for metal, wire, and sharper material streams
                - listitem [ref=e651]:
                  - generic [ref=e652]:
                    - text: one
                    - strong [ref=e653]: impact-oriented glove
                    - text: for heavier handling, rigging, or demolition tasks
                - listitem [ref=e654]:
                  - generic [ref=e655]:
                    - text: one
                    - strong [ref=e656]: chemical-resistant glove
                    - text: for wet cement, cleaners, sealants, or chemical contact tasks
                - listitem [ref=e657]:
                  - generic [ref=e658]:
                    - text: one
                    - strong [ref=e659]: welding or heat glove
                    - text: for hot work
                - listitem [ref=e660]:
                  - generic [ref=e661]:
                    - text: one
                    - strong [ref=e662]: electrical insulating glove system
                    - text: only where electrical PPE is actually required
              - paragraph [ref=e663]: That does not mean every site needs every glove family in the same quantities. It means most sites need more than one. The real procurement lesson is to simplify the program, but not to oversimplify it into one glove for every exposure.
              - heading "Common Glove Buying Mistakes on Construction Sites" [level=2] [ref=e669]
              - heading "Buying one glove for the whole site" [level=3] [ref=e670]
              - paragraph [ref=e671]: This is the biggest one. It lowers purchase complexity and usually increases hand-protection failures.
              - figure "Most glove failures come from oversimplified buying decisions, not from a lack of PPE on paper." [ref=e672]:
                - img "Most glove failures come from oversimplified buying decisions, not from a lack of PPE on paper." [ref=e674]
                - generic [ref=e675]: Most glove failures come from oversimplified buying decisions, not from a lack of PPE on paper.
              - heading "Choosing by price only" [level=3] [ref=e676]
              - paragraph [ref=e677]: Cheap gloves can be expensive when they fail early, reduce productivity, or create more injuries and replacements.
              - heading "Confusing durability with protection" [level=3] [ref=e678]
              - paragraph [ref=e679]: A thick glove is not automatically the right glove. It may still be weak against chemicals, cuts, heat, or electrical risk.
              - heading "Ignoring the actual substance" [level=3] [ref=e680]
              - paragraph [ref=e681]: Chemical glove selection without checking the actual material is weak PPE practice. Cement, solvent, oil, sealant, and cleaner exposures do not all behave the same way.
              - heading "Letting worn gloves stay in service too long" [level=3] [ref=e682]
              - paragraph [ref=e683]: Gloves fail gradually, which makes them easy to ignore. Coatings wear smooth. Liners open up. Leather hardens. Seams split. Once that happens, the glove is no longer doing the job it was chosen for.
              - heading "Overprotecting the task and destroying dexterity" [level=3] [ref=e684]
              - paragraph [ref=e685]: This is common in metal work and fastener-heavy tasks. If the glove prevents hand control, the worker may remove it at the exact moment exposure is highest.
              - heading "A Practical Supervisor Check Before Issuing Construction Gloves" [level=2] [ref=e691]
              - paragraph [ref=e692]: "Before a shift or before a new task starts, a useful glove check is short:"
              - list [ref=e693]:
                - listitem [ref=e694]: What is the actual hand hazard on this task?
                - listitem [ref=e695]: Is the glove chosen for abrasion, cut, impact, chemical, heat, or electrical risk?
                - listitem [ref=e696]: Does the glove fit the worker properly?
                - listitem [ref=e697]: Can the worker still control the tool, fastener, or material safely?
                - listitem [ref=e698]: Is the glove clean and intact enough to keep using?
                - listitem [ref=e699]: If chemicals are involved, has the actual substance been checked against glove compatibility?
              - paragraph [ref=e700]: That kind of check works better than a long glove policy nobody remembers.
              - heading "When Gloves Should Be Replaced" [level=2] [ref=e706]
              - paragraph [ref=e707]: Construction gloves are consumable PPE. Replacement should be expected, not delayed.
              - paragraph [ref=e708]: "Replace gloves when you see:"
              - list [ref=e709]:
                - listitem [ref=e710]: holes, tears, or split seams
                - listitem [ref=e711]: worn-through coating
                - listitem [ref=e712]: smooth or lost grip where grip matters
                - listitem [ref=e713]: contamination that cannot be cleaned safely
                - listitem [ref=e714]: hardened, brittle, or cracked material
                - listitem [ref=e715]: heat damage, burn marks, or melted areas
                - listitem [ref=e716]: any electrical glove condition that removes it from safe service
              - paragraph [ref=e717]: Chemical glove inspection deserves extra care. OSHA's PPE guidance notes that visual inspection can catch tears and obvious damage, but pinhole leaks may need a more thorough check, such as filling the glove with water and rolling the cuff to reveal leaks. OSHA also warns that discolored or stiff chemical gloves may indicate degradation from exposure.
              - paragraph [ref=e718]: "That is especially important for:"
              - list [ref=e719]:
                - listitem [ref=e720]: cement-contact gloves reused across shifts
                - listitem [ref=e721]: gloves exposed to cleaners, fuels, or sealants
                - listitem [ref=e722]: any glove being reused after chemical splash or repeated wet work
              - paragraph [ref=e723]: The other professional point many sites miss is reuse discipline. A glove can still look "usable" and already be chemically compromised. Reuse decisions for chemically exposed gloves should follow the manufacturer's guidance, not just a visual guess from the gang box.
              - paragraph [ref=e724]: For procurement teams, this is one reason glove strategy belongs inside the wider PPE program. Replacement rate matters just as much as initial selection.
              - heading "Which Related Pages To Use Next" [level=2] [ref=e730]
              - paragraph [ref=e731]: "Most buyers and supervisors do not stop at gloves alone. The next useful page depends on what question comes next:"
              - list [ref=e732]:
                - listitem [ref=e733]:
                  - generic [ref=e734]:
                    - text: Use
                    - link "Complete PPE Solution for Construction Sites" [ref=e735] [cursor=pointer]:

                    - link "Safety Footwear Guide for Construction Workers" [ref=e744] [cursor=pointer]:
                      - /url: /blog/construction-safety-footwear-guide
                    - text: when grip, puncture risk, or footing are part of the same hand-intensive task.
                - listitem [ref=e745]:

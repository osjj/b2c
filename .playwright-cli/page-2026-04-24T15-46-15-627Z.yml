                    - text: For
                    - strong [ref=e406]: electrical work
                    - text: ", stop treating gloves as ordinary hand PPE and move into electrical PPE selection, inspection, testing, and storage logic."
              - paragraph [ref=e407]: If a supplier only tells you "cut resistant" or "chemical resistant" without showing what that means in test or compatibility terms, the selection is still incomplete.
              - 'heading "Glove Materials and Coatings: What They Usually Do Well" [level=2] [ref=e408]'
